{% extends "base.html" %}

{% block content %}
<div class="py-5">
    <h1>Bookshelf</h1>
    <p class="lead">Keep track of the books you want to read, are reading or have read.</p>
    {% if current_user.is_authenticated %}
    <a class="btn btn-primary" href="{{ url_for('fe.books') }}">Go to my books</a>
    {% else %}
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Log in</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('auth.register') }}">Create an account</a>
    {% endif %}
</div>
{% endblock %}
